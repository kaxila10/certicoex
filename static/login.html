<!doctype html>
<html lang="es">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Acceso · Certicoex</title><link rel="stylesheet" href="/style.css"><script defer src="/login.js"></script><link rel="icon" type="image/png" href="/logo.png?v=1"><link rel="apple-touch-icon" href="/logo.png?v=1"><meta property="og:image" content="https://certicoex.onrender.com/logo.png"></head>
<body class="login-page"><main class="login-card card">
<a class="brand" href="/login"><img class="brand-logo" src="/logo.png" alt="" width="38" height="38">certicoex<span class="brand-dot">.</span></a>
<div class="eyebrow">ESPACIO DEL DEPARTAMENTO</div><h1>Inicia sesión</h1>
<p>Tu perfil y tu firma son personales. Las plantillas y las empresas se comparten con el equipo.</p>
<form id="login-form"><label>Usuario<input id="login-username" name="username" autocomplete="username" required maxlength="50" autofocus></label><label>Contraseña<input id="login-password" name="password" type="password" autocomplete="current-password" required maxlength="200"></label><button class="button primary full" id="login-submit" type="submit">Entrar</button><p id="login-error" class="validation" role="alert"></p></form>
<p class="login-help">Si necesitas una cuenta o restablecer tu contraseña, contacta con el administrador de Certicoex.</p>
</main></body></html>
